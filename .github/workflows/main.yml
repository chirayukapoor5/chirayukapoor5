name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Locks the OS version to silence the migration notice
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write # Explicitly grants the token permission to push code
    steps:
      - uses: actions/checkout@v4 # Updated to v4 to fix the Node 20 deprecation warning
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          # This line prevents the exit code 128 error if there are no new changes to commit today
          git diff --quiet && git diff --staged --quiet || (git commit -m "generated 3d contribution graph" && git push)
